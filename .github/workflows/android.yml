name: Android Build
on: workflow_dispatch
jobs:
  build:
    name: Android Build
    permissions: write-all
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Important for extension-androidtools

      - name: Set up Haxe
        uses: actions/setup-haxe@v1
        with:
          haxe-version: '4.2.5'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@main
        with:
          ndk-version: 'r25c'

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.haxelib/
            export/release/android/
          key: ${{ runner.os }}-haxe-${{ hashFiles('**/project.xml') }}

      - name: Install dependencies
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install extension-androidtools
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git
          haxelib run lime setup android -y

      - name: Configure Android paths
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME

      - name: Build APK
        run: |
          haxelib run lime build android -final -v

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Analog-Funkin-APK
          path: export/release/android/bin/*.apk
